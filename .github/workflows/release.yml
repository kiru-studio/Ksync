name: Release ksync

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish SMTC Bridge Native Component
        run: |
          dotnet publish smtc-bridge/smtc-bridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o smtc-bridge/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish_compressed

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend & Icons
        run: |
          npm run build
          npm run build:icon

      - name: Build & Publish Electron Release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always

      - name: Publish GitHub Release (Ensure Non-Draft)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (Test-Path "RELEASE_NOTES.md") {
            gh release edit ${{ github.ref_name }} --draft=false --latest --notes-file RELEASE_NOTES.md --title "v2.5.3 — Interactive Edge Trigger Configurator, In-App Volume & Studio Polish"
          } else {
            gh release edit ${{ github.ref_name }} --draft=false --latest
          }
